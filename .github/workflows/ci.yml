name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [develop, master]

env:
  NODE_VERSION: 22

permissions:
  contents: read

jobs:
  validate-pr-flow:
    name: Validate PR Flow
    runs-on: ubuntu-latest

    steps:
      - name: Validar branch de destino
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "${BASE_BRANCH}" = "master" ] && [ "${HEAD_BRANCH}" != "develop" ]; then
            echo "PRs para master devem sair da develop. Abra o PR ${HEAD_BRANCH} -> develop primeiro."
            exit 1
          fi

          if [ "${BASE_BRANCH}" = "develop" ] && ! echo "${HEAD_BRANCH}" | grep -Eq '^(feature|fix|infra|chore|refactor|docs|test)/'; then
            echo "PRs para develop devem sair de branches de trabalho versionadas por prefixo: feature/*, fix/*, infra/*, chore/*, refactor/*, docs/* ou test/*."
            exit 1
          fi

      - name: Validar push permitido
        if: github.event_name == 'push'
        run: echo "Push em branch monitorada pelo workflow; fluxo de PR não se aplica."

  validate-and-build:
    name: Lint, Format, Test & Build
    runs-on: ubuntu-latest
    needs: validate-pr-flow
    if: always() && (needs.validate-pr-flow.result == 'success' || needs.validate-pr-flow.result == 'skipped')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar configuração de build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: test -n "${VITE_API_URL}"

      - name: Verificar lint e formatação
        run: |
          npm run format:check
          npm run lint

      - name: Executar testes
        run: npm test

      - name: Build da aplicação
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build
